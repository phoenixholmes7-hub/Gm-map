name: Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Unit tests (routing, navigation maths)
        run: node --test tests/geo.test.mjs tests/nav.test.mjs

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Collect APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk gm-map.apk

      - uses: actions/upload-artifact@v7
        with:
          name: gm-map-apk
          path: gm-map.apk
          if-no-files-found: error
